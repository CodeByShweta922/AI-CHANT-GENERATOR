
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chant Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eee8ff, #fce7f3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px #00000015;
            text-align: center;
        }

        h1 {
            color: #6d28d9;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 18px 0 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f5f0ff;
            border-radius: 12px;
            color: #4c1d95;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>✨ AI Chant Generator</h1>

        <p>
            Enter your topic and create a motivational chant
            to inspire your day!
        </p>

        <form id="chantForm">
            <input
                type="text"
                id="topic"
                placeholder="Enter a topic, e.g. Study"
                required
            >

            <button type="submit">Generate My Chant ✨</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        const form = document.getElementById("chantForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const topic = document.getElementById("topic").value.trim();

            if (!topic) {
                return;
            }

            result.style.display = "block";
            result.textContent = "Creating your chant...";

            try {
                const response = await fetch(
                    "/chant?topic=" + encodeURIComponent(topic)
                );

                if (!response.ok) {
                    throw new Error("Could not generate chant");
                }

                const chant = await response.text();
                result.textContent = chant;
            } catch (error) {
                result.textContent =
                    "Could not connect. Please check that the server is running.";
            }
        });
    </script>
</body>
</html>
